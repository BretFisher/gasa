# Sample gasa configuration.
#
# This file is not auto-loaded because of its name.
# To use it directly:
#   gasa run --config .gasa.sample.yaml owner/repo
#
# To make it your active local config, copy or rename it to:
#   .gasa.yml
# or:
#   .gasa.yaml

# Select which built-in rules should run by default.
# If `include` is omitted, all built-in rules are eligible to run.
rules:
  include:
    - workflows/action-version-pinning
    - workflows/pull-request-target

  # Exclude rules from the selected set above.
  exclude:
    - updates/update-tool-actions-cooldown

# Override the default severity for specific built-in rules.
overrides:
  - rule: workflows/action-version-pinning
    severity: critical

# Configure rule-specific behavior.
rule_options:
  workflows/action-version-pinning:
    # Ignore mutable refs owned by the same GitHub user/org as the repo being
    # scanned. Without these, same-owner refs still flag: low when pinned to a
    # version tag, medium when pinned to a branch. Use them when you control
    # those repos through your own release and update process.
    ignore_same_owner_actions: true
    ignore_same_owner_reusable_workflows: true
    # Legacy shorthand for enabling both options above:
    # ignore_same_owner: true

  updates/update-tool-configuration:
    # Only run the update tool configuration rule when the repository actually
    # has workflow YAML files under .github/workflows.
    require_workflows: true

# Suppress known and reviewed findings.
# You can scope suppressions by rule, finding_id, and/or path.
suppressions:
  - rule: workflows/workflow-permissions
    path: .github/workflows/legacy.yml
    reason: reviewed exception
