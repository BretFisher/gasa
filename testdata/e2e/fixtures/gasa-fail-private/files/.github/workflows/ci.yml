# Deliberately correct: SHA-pinned, explicit permissions, no pull_request_target.
# The workflow rules must pass here so this fixture's only failures are the two
# updates rules it exists to exercise.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Fixture step
        run: echo "inert fixture workflow"
