name: release

on:
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7: manual releases require an explicit version input, validated later in this workflow
    inputs:
      version:
        description: Version to release in semver format, for example v0.1.0
        required: true
        type: string

# Deny all token scopes at the workflow root; each job grants only what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Gates release secrets behind the `release` environment (zizmor recommendation).
    # Environment secrets are ONLY readable by a job that declares the environment.
    environment: release

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        # persist-credentials required: this job pushes the release tag via `git push origin`
        uses: chainguard-actions/actions-checkout@13fd6145370c8613c14743a804ce42d854e76dcc # v6.0.3 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      - name: Ensure workflow runs from main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Release workflow must run from main"
            exit 1
          fi

      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like v0.1.0"
            exit 1
          fi

      - name: Ensure tag does not already exist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse "${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists locally"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists on origin"
            exit 1
          fi

      - name: Set up Go
        uses: chainguard-actions/actions-setup-go@a5e8c9530cdd8d86c8c1e22fe4e2d0668896f7c7 #v6.5.0
        with:
          go-version-file: go.mod
          # disable build caching: this job publishes release artifacts, so a poisoned cache must not feed the build
          cache: false

      - name: Set up Docker Buildx
        uses: chainguard-actions/docker-setup-buildx-action@b6beb8a80a92c55017146dc002f047479d776a98 # v4.1.0

      - name: Log in to GHCR
        uses: chainguard-actions/docker-login-action@2ec1a61ac7d5854002f4e3df1f32cc1d02994f76 # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity for release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"

      - name: Run GoReleaser
        uses: chainguard-actions/goreleaser-goreleaser-action@7c64773cc04d3281910fe0c87f70511960b2f971 #v7.2.2
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization (see .goreleaser.yml notarize block).
          # If these secrets are unset, notarization is skipped automatically.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          # Pushes the Homebrew cask to BretFisher/homebrew-tap.
          # Needs a PAT (not the default GITHUB_TOKEN) with Contents:write on the tap.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
