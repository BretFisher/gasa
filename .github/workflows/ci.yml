name: ci

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# reset permissions to none at the workflow level
# we'll set them at the job level below
permissions: {}

jobs:
  app:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@5c571b05fb026b9251781bee09aadc0d09736c72 #v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: chainguard-actions/actions-setup-go@a5e8c9530cdd8d86c8c1e22fe4e2d0668896f7c7 #v6.5.0
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

      - name: Build
        run: make build

  docker:
    runs-on: ubuntu-latest
    needs: app

    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@5c571b05fb026b9251781bee09aadc0d09736c72 #v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: chainguard-actions/docker-setup-buildx-action@b6beb8a80a92c55017146dc002f047479d776a98 # v4.1.0

      - name: Docker Bake
        run: docker buildx bake
