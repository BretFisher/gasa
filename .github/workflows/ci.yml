name: ci

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# reset permissions to none at the workflow level
# we'll set them at the job level below
permissions: {}

jobs:
  app:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@279383ec3b8d70f964ffa5a2151ea3d2a5317ec6 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: chainguard-actions/actions-setup-go@738fd0174f4ff963ac8c2e9dfe83e3191b2777fb # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

      - name: Build
        run: make build

  docker:
    runs-on: ubuntu-latest
    needs: app

    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@279383ec3b8d70f964ffa5a2151ea3d2a5317ec6 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: chainguard-actions/docker-setup-buildx-action@af0c2a5efbc8ec52ea29c928cddd4cb3628ae1af # v4.2.0

      - name: Docker Bake
        run: docker buildx bake
