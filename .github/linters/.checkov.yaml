# Checkov config for super-linter
# template source: https://github.com/super-linter/super-linter/blob/main/TEMPLATES/.checkov.yaml

# Don't report passed checks in output
quiet: true

# Globally skipped checks (apply to every scanned file)
skip-check:
  # CKV_DOCKER_7: "Ensure the base image uses a non latest version tag"
  # We intentionally use Chainguard images (cgr.dev), whose free public tier
  # only publishes the :latest tag. Versioned/pinned tags require a paid
  # subscription, so we cannot pin and must allow :latest here.
  - CKV_DOCKER_7

# Paths excluded from scanning entirely.
skip-path:
  # testdata/e2e holds the end-to-end fixture repositories. Some of those files
  # are deliberately insecure so gasa has something to detect -- the private
  # fixture's Dockerfile has no USER and no HEALTHCHECK on purpose. Fixing them
  # would destroy the fixture. Checkov still scans the real Dockerfiles at the
  # repository root.
  - testdata/.*
